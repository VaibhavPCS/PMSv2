---
apiVersion: v1
kind: Namespace
metadata:
  name: pms

---
# Shared secrets — credentials only. Never commit real values to git;
# use Sealed Secrets or an external secret operator in production.
apiVersion: v1
kind: Secret
metadata:
  name: pms-env
  namespace: pms
type: Opaque
stringData:
  NODE_ENV: "production"
  DB_BASE: "postgresql://pms:pms_secret@postgres-service:5432"
  KAFKA_BROKER: "kafka-service:9092"
  SUPERTOKENS_CONNECTION_URI: "http://supertokens-service:3567"
  SUPERTOKENS_API_KEY: "34753274y23o7ryefbjdsbflqkwidejqswv"
  # Service-to-service internal calls (workspace-service -> auth-service email lookup)
  AUTH_SERVICE_URL: "http://pms-auth:4001"
  INTERNAL_API_KEY: "change_me_internal_s2s_key"
  SEAWEEDFS_S3_ENDPOINT: "http://seaweedfs-service:8333"
  # Public, browser-reachable host used only to SIGN presigned download URLs.
  SEAWEEDFS_PUBLIC_ENDPOINT: "https://files.dev.pms.upda.co.in"
  SEAWEEDFS_REGION: "us-east-1"
  SEAWEEDFS_ACCESS_KEY: "pms_seaweed"
  SEAWEEDFS_SECRET_KEY: "pms_seaweed_secret"
  SEAWEEDFS_BUCKET: "pms-files"
  MESSAGE_ENCRYPTION_KEY: "8b8fb3f39f5ee7105300854dbfa7f5d56d7ba3f31b017572e541d688a5d27995"
  COMMENT_ENCRYPTION_KEY: "5f2c8a1d9e3b7406c1a8d2f6b934e0571cad8e23f9106b4d7e2a5c08f31b6d94"
  SMTP_HOST: "smtp.mailtrap.io"
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  WEBSITE_DOMAIN: "https://dev.pms.upda.co.in"
  LOG_LEVEL: "info"
  APP_NAME: "PMS"
  DOCS_ENABLED: "true"
  GITHUB_WEBHOOK_SECRET: "your_secret_here"

---
